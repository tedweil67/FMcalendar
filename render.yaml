services:
  - type: web
    name: fmcalendar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server/app.js
    healthCheckPath: /healthz
    envVars:
      - key: FM_MODE
        sync: false # set to 'mock' or 'odata' in the Render dashboard - NOT here, so a blueprint
        # re-sync (e.g. from any future render.yaml change) can never silently overwrite it
      - key: FM_BASE_URL
        sync: false
      - key: FM_DATABASE
        sync: false
      - key: FM_USERNAME
        sync: false
      - key: FM_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SHARED_USERNAME
        sync: false
      - key: SHARED_PASSWORD
        sync: false
      - key: WEBVIEWER_TOKEN
        generateValue: true # copy this value from the Render dashboard into the FileMaker Web Viewer's URL, see docs/filemaker-setup.md
      - key: NODE_ENV
        value: production
